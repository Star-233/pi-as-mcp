<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>HumanChat Web 界面 · 演示快照</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b8cff'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white'%3E%E2%97%8D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg:#0b0e14; --bg-2:#111624; --bg-3:#161d2e; --bg-4:#1e2739;
  --fg:#e8ecf4; --fg-2:#9aa7bd; --fg-3:#6b7789;
  --line:#212a3d; --line-2:#2d3a52;
  --accent:#5b8cff; --accent-2:#8b5cf6; --green:#34d399; --red:#f87171;
  --amber:#fbbf24; --cyan:#22d3ee;
  --radius:14px; --shadow:0 12px 34px rgba(0,0,0,.42);
  --bubble-agent:#151d2e; --bubble-human:linear-gradient(135deg,#3b6fe0,#5b3ce0);
  color-scheme: dark;
}
[data-theme="light"]{
  --bg:#f4f6fb; --bg-2:#ffffff; --bg-3:#f0f3fa; --bg-4:#e6ebf6;
  --fg:#131a26; --fg-2:#5b6779; --fg-3:#8a94a6;
  --line:#e2e7f0; --line-2:#d3dae7;
  --accent:#3b6fe0; --accent-2:#7048e8; --green:#0f9d63; --red:#dc2626;
  --amber:#b45309; --cyan:#0891b2;
  --shadow:0 12px 30px rgba(23,37,84,.12);
  --bubble-agent:#ffffff; --bubble-human:linear-gradient(135deg,#3b6fe0,#5b3ce0);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); font:14px/1.62 var(--font);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none !important}
.only-mobile{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:296px minmax(0,1fr);height:100vh;height:100dvh}

/* ---------------------------------------------------------------- 侧栏 */
.sidebar{
  background:var(--bg-2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; z-index:40;
}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px}
.brand .logo{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg-3);transition:background .3s}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(248,113,113,.16)}
.side-actions{display:flex;gap:6px}
.icon-btn{
  border:1px solid transparent;background:var(--bg-3);border-radius:9px;cursor:pointer;
  min-width:32px;height:32px;padding:0 9px;display:inline-grid;place-items:center;
  color:var(--fg-2);transition:.15s
}
.icon-btn:hover{background:var(--bg-4);color:var(--fg);border-color:var(--line-2)}
.side-search{padding:0 12px 8px}
.side-search input{
  width:100%;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;outline:none
}
.side-search input:focus{border-color:var(--accent)}
.sessions{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:3px}
.sess{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;
  padding:9px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent
}
.sess:hover{background:var(--bg-3)}
.sess.active{background:var(--bg-4);border-color:var(--line-2)}
.sess .s-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.sess .s-sub{grid-column:1;color:var(--fg-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .s-right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.sess .s-time{font-size:11px;color:var(--fg-3)}
.badge-n{
  background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;
  padding:1px 7px;min-width:20px;text-align:center
}
.badge-n.pending{background:transparent;color:var(--amber);border:1px solid rgba(251,191,36,.5)}
.sess .badge-row{display:flex;gap:4px;align-items:center}
.pulse{
  width:8px;height:8px;border-radius:50%;background:var(--amber);flex:0 0 auto;
  animation:pl 1.4s ease-in-out infinite
}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.side-foot{border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--fg-3);display:grid;gap:3px}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv b{color:var(--fg-2);font-weight:600}

/* ---------------------------------------------------------------- 主体 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.topbar{
  display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--bg-2);min-height:60px
}
.title-wrap{min-width:0;flex:1}
.title{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.subtitle{font-size:12px;color:var(--fg-3)}
.top-actions{display:flex;gap:6px}
.state-pill{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  background:var(--bg-3);border:1px solid var(--line-2);font-size:12.5px;color:var(--fg-2);
  white-space:nowrap
}
.state-pill.waiting{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.4);color:var(--amber);font-weight:650}
.state-pill.working{color:var(--green)}
.state-pill .ring{
  width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.85
}
.state-pill.waiting .ring{animation:pl 1.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

.banner{
  padding:9px 18px;font-size:13px;display:flex;align-items:center;gap:10px;
  background:rgba(248,113,113,.12);border-bottom:1px solid rgba(248,113,113,.32);color:var(--red)
}
.banner.info{background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.3);color:var(--accent)}

.messages{
  flex:1;overflow-y:auto;padding:20px 20px 6px;display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth
}
.day{text-align:center;color:var(--fg-3);font-size:12px;margin:8px 0 2px}
.msg{max-width:min(820px,94%);display:flex;flex-direction:column;gap:5px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.agent{align-self:flex-start}
.msg.human{align-self:flex-end;align-items:flex-end}
.msg.system{align-self:center;max-width:100%}
.msg .meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-3);padding:0 4px}
.msg .meta .who{font-weight:650;color:var(--fg-2)}
.msg.human .meta .who{color:var(--accent)}
.msg .body{
  background:var(--bubble-agent);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 14px;word-break:break-word;overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.06)
}
.msg.human .body{
  background:var(--bubble-human);border-color:transparent;color:#fff;
}
.msg.human .body a{color:#dbe7ff}
.msg.system .body{background:var(--bg-3);border-style:dashed;color:var(--fg-2);font-size:13px}
.msg.kind-question .body{border-color:rgba(251,191,36,.45)}
.msg.kind-error .body{border-color:rgba(248,113,113,.45)}
.msg.kind-done .body{border-color:rgba(52,211,153,.4)}
.msg.kind-progress .body{border-color:rgba(91,140,255,.35);color:var(--fg-2)}
.msg.kind-note .body{background:var(--bg-3)}
.msg .body p{margin:0 0 8px}
.msg .body p:last-child{margin-bottom:0}
.msg .body ul,.msg .body ol{margin:0 0 8px;padding-left:22px}
.msg .body li{margin:2px 0}
.msg .body h4{margin:2px 0 8px;font-size:14.5px}
.msg .body code{font-family:var(--mono);font-size:12.5px;background:rgba(127,127,127,.18);padding:1px 5px;border-radius:6px}
.msg.human .body code{background:rgba(255,255,255,.2)}
.msg .body pre{margin:0;overflow-x:auto}
.msg .body table{border-collapse:collapse;margin:8px 0;font-size:13px;display:block;overflow-x:auto;max-width:100%}
.msg .body th,.msg .body td{border:1px solid var(--line-2);padding:5px 10px;text-align:left;white-space:nowrap}
.msg .body th{background:rgba(127,127,127,.14);font-weight:650}
.msg .body tr:nth-child(even) td{background:rgba(127,127,127,.06)}
.msg .body pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.code{margin:8px 0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--bg)}
.msg.human .code{border-color:rgba(255,255,255,.25);background:rgba(0,0,0,.22)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:rgba(127,127,127,.14);font-size:11.5px;color:var(--fg-2)}
.code-head button{background:none;border:0;cursor:pointer;color:var(--fg-2);font-size:11.5px}
.code-head button:hover{color:var(--fg)}
.code pre{padding:10px 12px}
.msg-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s;padding:0 4px}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{
  background:none;border:0;cursor:pointer;color:var(--fg-3);font-size:11.5px;padding:1px 3px
}
.msg-actions button:hover{color:var(--accent)}
mark.hit{background:rgba(255,214,102,.45);color:inherit;border-radius:3px}
.jump{
  position:absolute;right:22px;bottom:104px;border:0;cursor:pointer;z-index:12;
  background:var(--accent);color:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;
  box-shadow:var(--shadow)
}
.typing{display:flex;align-items:center;gap:8px;color:var(--amber);font-size:12.5px;padding:0 4px 2px}
.typing .ring{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pl 1.4s ease-in-out infinite}

.msg-search{display:flex;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.msg-search input{flex:1;background:var(--bg-3);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
.msg-search span{font-size:12px;color:var(--fg-3);white-space:nowrap}
.msg-search button{background:none;border:0;cursor:pointer;color:var(--fg-3)}

/* ---------------------------------------------------------------- 输入区 */
.composer{
  border-top:1px solid var(--line);background:var(--bg-2);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:flex-end;position:relative
}
#input{
  flex:1;min-height:46px;max-height:38vh;resize:none;background:var(--bg-3);
  border:1px solid var(--line-2);border-radius:13px;padding:12px 13px;outline:none;line-height:1.55
}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.13)}
.composer-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.send-btn{
  border:0;cursor:pointer;border-radius:12px;padding:12px 20px;font-weight:650;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--shadow)
}
.send-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.hint{font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.cmd-menu{
  position:absolute;bottom:calc(100% - 6px);left:16px;background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:12px;padding:6px;min-width:300px;box-shadow:var(--shadow);z-index:30
}
.cmd-menu .item{display:flex;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;align-items:baseline}
.cmd-menu .item.on{background:var(--bg-4)}
.cmd-menu .item code{font-family:var(--mono);color:var(--accent);font-size:12.5px;min-width:78px}
.cmd-menu .item span{font-size:12px;color:var(--fg-2)}

/* ---------------------------------------------------------------- 弹层 */
.modal{position:fixed;inset:0;background:rgba(4,6,12,.6);display:grid;place-items:center;z-index:60;padding:18px;backdrop-filter:blur(3px)}
.modal-card{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:16px;padding:18px;
  width:min(640px,100%);max-height:86vh;overflow:auto;box-shadow:var(--shadow)
}
.modal-card h3{margin:0 0 10px;font-size:15px}
.modal-card p{margin:0 0 12px;color:var(--fg-2)}
.modal-card input,.modal-card textarea{
  width:100%;background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;outline:none
}
.modal-card pre{
  background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:12px;
  font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;max-height:56vh;overflow:auto;margin:0
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line-2);background:var(--bg-3);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{background:var(--bg-4)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;font-weight:650}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;display:none}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:999px;padding:9px 18px;
  box-shadow:var(--shadow);font-size:13px
}
.empty{color:var(--fg-3);text-align:center;padding:60px 20px;font-size:13.5px}
.empty b{display:block;color:var(--fg-2);font-size:15px;margin-bottom:6px}

/* ---------------------------------------------------------------- 窄屏 */
@media (max-width:880px){
  #app{grid-template-columns:1fr}
  .topbar{gap:8px;padding:10px 12px;min-height:54px}
  .subtitle{display:none}
  .top-actions .icon-btn.opt{display:none}
  .title{font-size:14px}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;width:88vw;max-width:330px;
    transform:translateX(-103%);transition:transform .22s ease;box-shadow:var(--shadow)
  }
  .sidebar.open{transform:none}
  .scrim.show{display:block}
  .only-mobile{display:inline-grid}
  .messages{padding:14px 12px 4px}
  .msg{max-width:100%}
  .state-pill{font-size:11.5px;padding:5px 10px}
  .jump{bottom:112px;right:14px}
}
@media (max-width:560px){
  .state-pill{padding:4px 9px;font-size:11px}
  .top-actions{gap:4px}
  .icon-btn{min-width:30px;height:30px;padding:0 7px}
  .composer{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .composer-side .hint{display:none}
  .msg .body{padding:10px 12px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand"><span class="logo">◍</span><span>humanchat</span><span class="dot" id="connDot"></span></div>
      <div class="side-actions">
        <button class="icon-btn" id="btnNew" title="新建会话 (Ctrl+Shift+N)">＋</button>
        <button class="icon-btn" id="btnTheme" title="切换深色 / 浅色">◐</button>
      </div>
    </div>
    <div class="side-search"><input id="search" placeholder="搜索会话…" autocomplete="off"></div>
    <div class="sessions" id="sessionList"></div>
    <div class="side-foot">
      <div class="kv"><span>broker</span><b id="brokerState">…</b></div>
      <div class="kv"><span>人类窗口</span><b id="humanClients">-</b></div>
      <div class="kv"><span>Agent</span><b id="agentStateFoot">-</b></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" title="会话列表">☰</button>
      <div class="title-wrap">
        <div class="title" id="sessionTitle" title="双击可重命名">default</div>
        <div class="subtitle" id="sessionSub">连接中…</div>
      </div>
      <div class="state-pill" id="statePill"><i class="ring"></i><span id="stateText">连接中…</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnSearchMsg" title="在对话中搜索 (Ctrl+F)">🔍</button>
        <button class="icon-btn opt" id="btnRules" title="强制规则">§</button>
        <button class="icon-btn opt" id="btnStatus" title="通道状态">ⓘ</button>
        <button class="icon-btn opt" id="btnExport" title="导出记录 (Markdown)">⤓</button>
      </div>
    </header>
    <div class="banner hidden" id="banner"></div>
    <div class="msg-search hidden" id="msgSearch">
      <input id="msgSearchInput" placeholder="在对话里搜索…" autocomplete="off">
      <span id="msgSearchCount"></span>
      <button id="msgSearchClose" title="关闭">✕</button>
    </div>
    <section class="messages" id="messages"></section>
    <button class="jump hidden" id="btnJump">↓ 新消息</button>
    <footer class="composer">
      <div class="cmd-menu hidden" id="cmdMenu"></div>
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 · Shift+Enter 换行 · / 命令）"></textarea>
      <div class="composer-side">
        <div class="hint" id="composerHint">Enter 发送 · Shift+Enter 换行</div>
        <button class="send-btn" id="btnSend" disabled>发送</button>
      </div>
    </footer>
  </main>
</div>
<div class="modal hidden" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast hidden" id="toast"></div>
<script>
/* ==========================================================================
   演示模式：这个文件是 Web 界面的“静态快照”，自带一组假数据。
   它会拦截 fetch / EventSource 并用内置数据回答，因此可以离线打开、不需要
   broker、也不会发起任何网络请求。真实界面请用 `humanchat web` 启动。

      return;
    }
    var lastDay = "";
    S.messages.forEach(function (m) {
      var dk = dayKey(m.ts);
      if (dk !== lastDay) {
        lastDay = dk;
        var day = document.createElement("div");
        day.className = "day";
        day.textContent = dayLabel(m.ts);
        box.appendChild(day);
      }
      box.appendChild(messageEl(m));
    });
    renderTyping();
    scrollToBottom(false);
  }
  function appendMessage(m) {
    var box = $("#messages");
    var empty = $(".empty", box);
    if (empty) { box.innerHTML = ""; }
    var prev = S.messages[S.messages.length - 1];
    if (!prev || dayKey(prev.ts) !== dayKey(m.ts)) {
      var day = document.createElement("div");
      day.className = "day";
      day.textContent = dayLabel(m.ts);
      box.appendChild(day);
    }
    var typing = $("#typingRow");
    var el = messageEl(m);
    if (typing) { box.insertBefore(el, typing); } else { box.appendChild(el); }
    if (S.atBottom) { scrollToBottom(true); } else { showJump(true); }
  }
  function renderTyping() {
    var box = $("#messages");
    var old = $("#typingRow");
    if (old) { old.remove(); }
    if (!S.status || S.status.state !== "waiting") { return; }
    var row = document.createElement("div");
    row.className = "typing";
    row.id = "typingRow";
    row.innerHTML = '<i class="ring"></i><span>\u{1F514} Agent \u6b63\u5728\u7b49\u5f85\u4f60\u7684\u56de\u590d ' +
      "<b>" + mmss(Date.now() / 1000 - (S.status.since || Date.now() / 1000)) + "</b></span>";
    box.appendChild(row);
    if (S.atBottom) { scrollToBottom(true); }
  }
  function scrollToBottom(smooth) {
    var box = $("#messages");
    if (smooth) { box.scrollTo({ top: box.scrollHeight, behavior: "smooth" }); }
    else { box.scrollTop = box.scrollHeight; }
    S.atBottom = true;
    showJump(false);
  }
  function showJump(show) { $("#btnJump").classList.toggle("hidden", !show); }

  // ---------------------------------------------------------------- 渲染：状态
  function statusLabel(status) {
    if (!status || !status.state || status.state === "idle") { return { text: "\u7a7a\u95f2", cls: "" }; }
    if (status.state === "waiting") {
      return {
        text: "\u{1F514} \u6b63\u5728\u7b49\u5f85\u4f60\u7684\u56de\u590d (" +
          mmss(Date.now() / 1000 - (status.since || Date.now() / 1000)) + ")",
        cls: "waiting"
      };
    }
    if (status.state === "working") { return { text: "\u25CF Agent \u6b63\u5728\u5de5\u4f5c", cls: "working" }; }
    return { text: status.state, cls: "" };
  }
  function renderStatus() {
    var pill = $("#statePill");
    var info = statusLabel(S.status);
    pill.className = "state-pill " + info.cls;
    $("#stateText").textContent = info.text;
    var foot = { idle: "\u7a7a\u95f2", waiting: "\u7b49\u5f85\u4f60", working: "\u5de5\u4f5c\u4e2d" }[S.status && S.status.state] || "\u2014";
    $("#agentStateFoot").textContent = foot;
    $("#humanClients").textContent = S.humans ? S.humans + " \u4e2a\u7a97\u53e3" : "\u672a\u8fde\u63a5";
    $("#brokerState").textContent = S.connected ? (S.server.mode === "remote" ? "\u5e38\u9a7b" : "\u5185\u5d4c") : "\u65ad\u5f00";
    renderTyping();
  }
  var everConnected = false;
  function setConnected(on, error) {
    var was = S.connected;
    S.connected = !!on;
    $("#connDot").className = "dot " + (on ? "on" : "off");
    var banner = $("#banner");
    if (!on) {
      banner.className = "banner";
      banner.textContent = "\u26A0\uFE0F \u4e0e broker \u65ad\u5f00\uff0c\u6b63\u5728\u91cd\u8fde\u2026" + (error ? "\uff08" + error + "\uff09" : "");
      banner.classList.remove("hidden");
    } else {
      if (!was && everConnected) {   // 只有“断过又回来”才提示，首次加载保持干净
        banner.className = "banner info";
        banner.textContent = "\u5df2\u91cd\u65b0\u8fde\u63a5\u5230 broker";
        setTimeout(function () { banner.classList.add("hidden"); }, 2200);
      } else {
        banner.classList.add("hidden");
      }
      everConnected = true;
    }
    renderStatus();
  }
  function toast(text, ms) {
    var el = $("#toast");
    el.textContent = text;
    el.classList.remove("hidden");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.add("hidden"); }, ms || 2600);
  }

  // ---------------------------------------------------------------- 数据
  function applySnapshot(session) {
    if (!session) { return; }
    S.messages = session.messages || [];
    S.status = session.status || S.status || {};
    S.seen = {};
    S.messages.forEach(function (m) { S.seen[session.id + ":" + m.seq] = true; });
    $("#sessionTitle").textContent = session.title || session.id;
    $("#sessionSub").textContent = (session.count || S.messages.length) + " \u6761\u6d88\u606f";
    renderMessages();
    renderStatus();
    flashTitle();
  }
  function refresh() {
    return api("/api/state?session=" + encodeURIComponent(S.session)).then(function (data) {
      S.server = data.server || {};
      if (data.session_id) { S.session = data.session_id; }
      S.sessions = data.sessions || [];
      S.humans = data.human_clients || 0;
      S.pendingCount = data.pending_count || 0;
      setConnected(!!data.connected, data.error);
      applySnapshot(data.session);
      renderSessions();
      if (S.session) { localStorage.setItem("hc.session", S.session); }
    }).catch(function (err) {
      setConnected(false, err.message);
    });
  }

  function switchSession(id) {
    if (!id || id === S.session) { closeSidebar(); return; }
    S.session = id;
    localStorage.setItem("hc.session", id);
    clearUnread(id);
    var url = new URL(location.href);
    url.searchParams.set("session", id);
    history.replaceState(null, "", url.toString());
    S.messages = []; S.seen = {}; S.status = {};
    $("#messages").innerHTML = "";
    $("#sessionTitle").textContent = id;
    refresh();
    connectEvents();
    closeSidebar();
  }

  // ---------------------------------------------------------------- SSE
  function handle(ev) {
    var name = ev.event;
    if (name === "message" || name === "agent_message") {
      var m = ev.message || {};
      var key = ev.session + ":" + m.seq;
      if (S.seen[key]) { return; }
      S.seen[key] = true;
      if (ev.session === S.session) {
        S.messages.push(m);
        appendMessage(m);
        if (m.role === "agent" && m.kind !== "progress") {
          beep(m.kind === "done" ? "done" : (m.kind === "error" ? "error" : "msg"));
          desktopNotify("Agent" + (KIND[m.kind] ? " \u00b7 " + KIND[m.kind].label : ""), String(m.text || "").slice(0, 120));
        }
      } else {
        var target = S.sessions.filter(function (s) { return s.id === ev.session; })[0];
        if (!target) { target = { id: ev.session, count: 0 }; S.sessions.push(target); }
        target.count = (target.count || 0) + 1;
        target.preview = String(m.text || "").slice(0, 120);
        target.updated_at = m.ts;
        if (m.role === "agent" && m.kind !== "progress") {
          S.unread[ev.session] = (S.unread[ev.session] || 0) + 1;
          flashTitle();
          beep(m.kind === "done" ? "done" : "msg");
        }
        renderSessions();
      }
      return;
    }
    if (name === "status") {
      if (ev.session === S.session) {
        var prev = S.status && S.status.state;
        S.status = ev.status || {};
        if (S.status.state === "waiting" && prev !== "waiting") {
          beep("waiting");
          desktopNotify("Agent \u5728\u7b49\u4f60\u56de\u590d", S.status.reason || S.status.hint || "");
        }
        renderStatus();
      }
      var s = S.sessions.filter(function (x) { return x.id === ev.session; })[0];
      if (s) { s.state = (ev.status || {}).state; renderSessions(); }
      return;
    }
    if (name === "sessions") {
      S.sessions = ev.sessions || [];
      renderSessions();
      return;
    }
    if (name === "clients") { S.humans = ev.humans || 0; renderStatus(); return; }
    if (name === "cleared") {
      if (ev.session === S.session) { S.messages = []; S.seen = {}; renderMessages(); }
      return;
    }
    if (name === "connection") {
      setConnected(!!ev.connected, ev.error);
      if (ev.connected) { refresh(); }
      return;
    }
    if (name === "snapshot") {
      if (ev.session === S.session) { applySnapshot(ev.session_data); }
      return;
    }
  }
  function connectEvents() {
    if (S.es && S.esSession === S.session) { return; }
    if (S.es) { S.es.close(); S.es = null; }
    var url = withToken("/api/events?session=" + encodeURIComponent(S.session));
    var es = new EventSource(url);
    S.es = es;
    S.esSession = S.session;
    es.onopen = function () { setConnected(true); };
    es.onerror = function () { setConnected(false, "\u8fde\u63a5\u4e2d\u65ad"); };
    es.onmessage = function (e) {
      var data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      try { handle(data); } catch (err) { console.error(err); }
    };
  }

  // ---------------------------------------------------------------- 发送
  function send(text) {
    text = String(text || "").trim();
    if (!text) { return; }
    var input = $("#input");
    input.value = "";
    input.style.height = "auto";
    updateSendState();
    if (text.charAt(0) === "/") { runCommand(text); return; }
    api("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: S.session, text: text })
    }).catch(function (err) { toast("\u53d1\u9001\u5931\u8d25\uff1a" + err.message); });
  }

  // ---------------------------------------------------------------- / 命令
  var COMMANDS = [
    { cmd: "/help", desc: "\u663e\u793a\u5e2e\u52a9" },
    { cmd: "/new [id]", desc: "\u65b0\u5efa\u4f1a\u8bdd" },
    { cmd: "/rename <\u6807\u9898>", desc: "\u91cd\u547d\u540d\u5f53\u524d\u4f1a\u8bdd" },
    { cmd: "/switch <id>", desc: "\u5207\u6362\u4f1a\u8bdd" },
    { cmd: "/clear", desc: "\u6e05\u7a7a\u5f53\u524d\u4f1a\u8bdd\u8bb0\u5f55" },
    { cmd: "/export", desc: "\u5bfc\u51fa\u5f53\u524d\u4f1a\u8bdd\uff08Markdown\uff09" },
    { cmd: "/status", desc: "\u901a\u9053\u72b6\u6001" },
    { cmd: "/rules", desc: "\u5f3a\u5236\u89c4\u5219" },
    { cmd: "/search <\u5173\u952e\u8bcd>", desc: "\u5728\u5bf9\u8bdd\u91cc\u641c\u7d22" },
    { cmd: "/sound", desc: "\u5f00/\u5173\u63d0\u793a\u97f3" },
    { cmd: "/theme", desc: "\u5207\u6362\u6df1\u8272/\u6d45\u8272" }
  ];
  function runCommand(text) {
    var parts = text.trim().split(/\s+/);
    var name = parts[0].toLowerCase();
    var rest = text.trim().slice(parts[0].length).trim();
    if (name === "/help") { showHelp(); return; }
    if (name === "/new") { newSession(rest || ""); return; }
    if (name === "/rename") { renameSession(rest); return; }
    if (name === "/switch") { switchSession(rest); return; }
    if (name === "/clear") { clearSession(); return; }
    if (name === "/export") { exportSession(); return; }
    if (name === "/status") { showStatus(); return; }
    if (name === "/rules") { showRules(); return; }
    if (name === "/search") { openMsgSearch(); $("#msgSearchInput").value = rest; doMsgSearch(); return; }
    if (name === "/sound") {
      var off = localStorage.getItem("hc.sound") === "off";
      localStorage.setItem("hc.sound", off ? "on" : "off");
      toast("\u63d0\u793a\u97f3\uff1a" + (off ? "\u5df2\u5f00\u542f" : "\u5df2\u5173\u95ed"));
      return;
    }
    if (name === "/theme") { toggleTheme(); return; }
    toast("\u672a\u77e5\u547d\u4ee4\uff1a" + name + "\uff08\u8f93\u5165 /help \u67e5\u770b\u5168\u90e8\uff09");
  }
  function renderCmdMenu() {
    var menu = $("#cmdMenu");
    var value = $("#input").value;
    if (value.charAt(0) !== "/" || value.indexOf(" ") > 0) { menu.classList.add("hidden"); return; }
    var q = value.toLowerCase();
    var hits = COMMANDS.filter(function (c) { return c.cmd.toLowerCase().indexOf(q) === 0; });
    if (!hits.length) { menu.classList.add("hidden"); return; }
    menu.innerHTML = hits.map(function (c) {
      return '<div class="item"><code>' + esc(c.cmd) + "</code><span>" + esc(c.desc) + "</span></div>";
    }).join("");
    menu.classList.remove("hidden");
  }

  // ---------------------------------------------------------------- 弹层
  var modalResolve = null;

          '" placeholder="' + esc(opts.placeholder || "") + '">') +
        '<div class="modal-actions">' +
          (opts.cancel === false ? "" : '<button class="btn" data-x="cancel">\u53d6\u6d88</button>') +
          '<button class="btn primary" data-x="ok">' + esc(opts.ok || "\u786e\u5b9a") + "</button>" +
        "</div>"
      );

  function infoModal(title, html) {

    infoModal("\u5feb\u6377\u952e\u4e0e\u547d\u4ee4",
      "<pre>" + esc(
        "Enter            \u53d1\u9001\n" +

        "Ctrl+Shift+N     \u65b0\u5efa\u4f1a\u8bdd\n" +
        "Esc              \u5173\u95ed\u5f39\u5c42 / \u641c\u7d22\u6846\n" +

  function showRules() {

  function showStatus() {
    api("/api/state?session=" + encodeURIComponent(S.session)).then(function (data) {
      var txt = [
        "broker:      " + (data.server.endpoint || "-"),
        "\u6a21\u5f0f:        " + (data.server.mode || "-") + "    pid=" + (data.server.pid || "-"),
        "\u7aef\u53e3:        " + (data.server.version || ""),
        "\u8fde\u63a5:      " + (data.connected ? "\u6b63\u5e38" : "\u65ad\u5f00"),
        "\u4eba\u7c7b\u7a97\u53e3:    " + (data.human_clients || 0),
        "\u672a\u5904\u7406\u6d88\u606f: " + (data.pending_count || 0),
        "\u4f1a\u8bdd:      " + S.session,
        "\u4f1a\u8bdd\u6570:    " + (data.sessions || []).length,
        "Agent \u72b6\u6001:  " + ((data.session && data.session.status && data.session.status.state) || "-"),
        "\u63a5\u5165\u547d\u4ee4:   " + (data.attach_command || "-")
      ].join("\n");
      infoModal("\u901a\u9053\u72b6\u6001", "<pre>" + esc(txt) + "</pre>");
    }).catch(function (err) { toast(err.message); });
  }
  function newSession(id) {
    dialog({ title: "\u65b0\u5efa\u4f1a\u8bdd", body: "\u7559\u7a7a\u4f1a\u81ea\u52a8\u751f\u6210 id\u3002", input: id || "", placeholder: "\u4f8b\u5982 deploy", ok: "\u521b\u5efa" })
      .then(function (value) {
        if (value === null) { return; }
        return post("/api/session/new", { session: String(value).trim() }).then(function (data) {
          return refresh().then(function () { switchSession(data.session.id); });
        });
      }).catch(function (err) { toast("\u521b\u5efa\u5931\u8d25\uff1a" + err.message); });
  }
  function renameSession(title) {
    var current = S.sessions.filter(function (s) { return s.id === S.session; })[0] || {};
    var go = function (value) {
      if (value === null) { return; }
      post("/api/session/rename", { session: S.session, title: String(value) })
        .then(function () { $("#sessionTitle").textContent = String(value) || S.session; return refresh(); })
        .catch(function (err) { toast("\u91cd\u547d\u540d\u5931\u8d25\uff1a" + err.message); });
    };
    if (title) { go(title); return; }
    dialog({ title: "\u91cd\u547d\u540d\u4f1a\u8bdd", input: current.title || "", placeholder: "\u4f1a\u8bdd\u6807\u9898", ok: "\u4fdd\u5b58" }).then(go);
  }
  function clearSession() {
    dialog({ title: "\u6e05\u7a7a\u4f1a\u8bdd\uff1f", body: "\u4f1a\u5220\u9664\u672c\u4f1a\u8bdd\u7684\u5168\u90e8\u6d88\u606f\uff08\u5305\u62ec\u78c1\u76d8\u8bb0\u5f55\uff09\uff0c\u4e0d\u53ef\u64a4\u9500\u3002", ok: "\u6e05\u7a7a" })
      .then(function (value) {
        if (!value) { return; }
        post("/api/session/clear", { session: S.session })
          .then(function () { S.messages = []; S.seen = {}; renderMessages(); toast("\u5df2\u6e05\u7a7a"); })
          .catch(function (err) { toast("\u6e05\u7a7a\u5931\u8d25\uff1a" + err.message); });
      });
  }
  function exportSession() {
    var suffix = withToken("/api/export?session=" + encodeURIComponent(S.session) + "&download=1");
    window.open(suffix, "_blank");
  }

  // ---------------------------------------------------------------- 搜索
  function openMsgSearch() {
    $("#msgSearch").classList.remove("hidden");
    $("#msgSearchInput").focus();
  }
  function closeMsgSearch() {
    $("#msgSearch").classList.add("hidden");
    $("#msgSearchInput").value = "";
    doMsgSearch();
  }
  function doMsgSearch() {
    var q = $("#msgSearchInput").value.trim();
    $$(".msg").forEach(function (el) {
      var body = $(".body", el);
      body.innerHTML = body.innerHTML.replace(/<mark class="hit">([\s\S]*?)<\/mark>/g, "$1");
      el.classList.remove("hidden");
    });
    if (!q) { $("#msgSearchCount").textContent = ""; return; }
    var hits = 0, first = null;
    S.messages.forEach(function (m) {
      if (String(m.text || "").toLowerCase().indexOf(q.toLowerCase()) < 0) { return; }
      var el = $('.msg[data-seq="' + m.seq + '"]');
      if (!el) { return; }
      var body = $(".body", el);
      body.innerHTML = highlight(body.innerHTML, q);
      hits++;
      if (!first) { first = el; }
    });
    $("#msgSearchCount").textContent = hits + " \u6761\u5339\u914d";
    if (first) { first.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }
  function highlight(html, q) {
    // 只在标签之外做高亮：用占位符切掉 <...>
    var re = /<[^>]+>|[^<]+/g, out = "";
    var lowerQ = q.toLowerCase();
    html.replace(re, function (chunk) {
      if (chunk.charAt(0) === "<") { out += chunk; return; }
      var text = chunk, res = "", idx = 0, low = text.toLowerCase();
      while (true) {
        var at = low.indexOf(lowerQ, idx);
        if (at < 0) { res += text.slice(idx); break; }
        res += text.slice(idx, at) + '<mark class="hit">' + text.slice(at, at + q.length) + "</mark>";
        idx = at + q.length;
      }
      out += res;
      return "";
    });
    return out;
  }

      "<p>Web \u754c\u9762\u5df2\u5f00\u542f\u4ee4\u724c\u4fdd\u62a4\u3002\u8bf7\u7c98\u8d34\u542f\u52a8\u65f6\u6253\u5370\u7684 token\uff08\u6216\u5e26 token \u7684\u5b8c\u6574 URL\uff09\u3002</p>" +
      '<input id="gateInput" placeholder="token">' +
      '<div class="modal-actions"><button class="btn primary" id="gateOk">\u8fdb\u5165</button></div></div>';
    document.body.appendChild(el);
    var submit = function () {
      var value = $("#gateInput").value.trim();
      var match = value.match(/[?&]token=([^&\s]+)/);
      if (match) { value = decodeURIComponent(match[1]); }
      if (!value) { return; }
      S.token = value;
      localStorage.setItem("hc.token", value);
      el.remove();
      refresh();
      connectEvents();
    };
    $("#gateOk").addEventListener("click", submit);
    $("#gateInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { submit(); } });
    $("#gateInput").focus();
  }

  // ---------------------------------------------------------------- 事件绑定
  function updateSendState() {
    var value = $("#input").value;
    $("#btnSend").disabled = !value.trim();
    var hint = $("#composerHint");
    if (S.status && S.status.state === "waiting") {
      hint.textContent = "\u{1F514} Agent \u5728\u7b49\u4f60\u7684\u56de\u590d";
    } else if (isStopWord(value) && value.trim()) {
      hint.textContent = "\u8fd9\u53e5\u4f1a\u544a\u8bc9 Agent \u53ef\u4ee5\u7ed3\u675f\u5bf9\u8bdd";
    } else {
      hint.textContent = "Enter \u53d1\u9001 \u00b7 Shift+Enter \u6362\u884c";
    }
  }
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.38) + "px";
  }
  function bind() {
    var input = $("#input");
    input.addEventListener("input", function () { autoGrow(input); updateSendState(); renderCmdMenu(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && !e.altKey) { e.preventDefault(); send(input.value); return; }
      if (e.key === "ArrowUp" && !input.value && S.history.length) {
        e.preventDefault();
        S.histIdx = S.histIdx < 0 ? S.history.length - 1 : Math.max(0, S.histIdx - 1);
        input.value = S.history[S.histIdx]; autoGrow(input); updateSendState();
        return;
      }
      if (e.key === "ArrowDown" && S.histIdx >= 0) {
        e.preventDefault();
        S.histIdx++;
        if (S.histIdx >= S.history.length) { S.histIdx = -1; input.value = ""; }
        else { input.value = S.history[S.histIdx]; }
        autoGrow(input); updateSendState();
      }
      if (e.key === "Escape") { $("#cmdMenu").classList.add("hidden"); }
    });
    $("#btnSend").addEventListener("click", function () { send(input.value); });
    $("#btnNew").addEventListener("click", function () { newSession(""); });
    $("#btnTheme").addEventListener("click", toggleTheme);
    $("#btnMenu").addEventListener("click", openSidebar);
    $("#scrim").addEventListener("click", closeSidebar);
    $("#search").addEventListener("input", function () { S.filter = this.value; renderSessions(); });
    $("#btnRules").addEventListener("click", showRules);
    $("#btnStatus").addEventListener("click", showStatus);
    $("#btnExport").addEventListener("click", exportSession);
    $("#btnSearchMsg").addEventListener("click", openMsgSearch);
    $("#msgSearchClose").addEventListener("click", closeMsgSearch);
    $("#msgSearchInput").addEventListener("input", doMsgSearch);
    $("#btnJump").addEventListener("click", function () { scrollToBottom(true); });
    $("#sessionTitle").addEventListener("dblclick", function () { renameSession(""); });
    $("#messages").addEventListener("scroll", function () {
      var box = this;
      var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
      S.atBottom = nearBottom;
      showJump(!nearBottom);
    });
    $("#messages").addEventListener("click", function (e) {
      var btn = e.target.closest("button");
      if (!btn) { return; }
      var msgEl = btn.closest(".msg");
      var seq = msgEl ? Number(msgEl.dataset.seq) : 0;
      var msg = S.messages.filter(function (m) { return m.seq === seq; })[0] || {};
      if (btn.dataset.copy !== undefined) {
        copyText(decodeURIComponent(btn.dataset.copy));
        return;
      }
      var act = btn.dataset.act;
      if (act === "copy") { copyText(msg.text || ""); }
      else if (act === "quote") {
        $("#input").value = (msg.text || "").split("\n").map(function (line) { return "> " + line; }).join("\n") + "\n";
        $("#input").focus(); autoGrow($("#input")); updateSendState();
      } else if (act === "again") { send(msg.text || ""); }
    });
    $("#modal").addEventListener("click", function (e) {
      if (e.target.id === "modal") { closeModal(null); return; }
      var x = e.target.dataset ? e.target.dataset.x : null;
      if (x === "cancel") { closeModal(null); }
      if (x === "ok") {
        var input = $("#dlgInput");
        closeModal(input ? input.value : true);
      }
    });
    document.addEventListener("keydown", function (e) {
      var meta = e.ctrlKey || e.metaKey;
      if (meta && e.key.toLowerCase() === "k") { e.preventDefault(); $("#search").focus(); }
      else if (meta && !e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); openMsgSearch(); }
      else if (meta && e.shiftKey && e.key.toLowerCase() === "n") { e.preventDefault(); newSession(""); }
      else if (e.key === "Escape") {
        if (!$("#modal").classList.contains("hidden")) { closeModal(null); }
        else if (!$("#msgSearch").classList.contains("hidden")) { closeMsgSearch(); }
      }
    });
    document.addEventListener("click", function once() {
      // 第一次交互后再申请通知权限 / 解锁音频，避免浏览器自动播放限制
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().catch(function () {});
      }
      try { if (audio() && audio().state === "suspended") { audio().resume(); } } catch (e) {}
      document.removeEventListener("click", once);
    });
    window.addEventListener("beforeunload", function () { if (S.es) { S.es.close(); } });
  }
  function copyText(text) {
    var done = function () { toast("\u5df2\u590d\u5236"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else { fallbackCopy(text, done); }
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("\u590d\u5236\u5931\u8d25"); }
    ta.remove();
  }

  // ---------------------------------------------------------------- 启动
  function boot() {
    var theme = localStorage.getItem("hc.theme");
    var prefersLight = false;
    try { prefersLight = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches); } catch (e) {}
    if (!theme) { theme = prefersLight ? "light" : "dark"; }
    document.documentElement.setAttribute("data-theme", theme);
    if (qs.get("token")) {
      // 清掉地址栏里的 token，避免被书签/分享泄露（服务端已种下 cookie）
      var url = new URL(location.href);
      url.searchParams.delete("token");
      history.replaceState(null, "", url.toString());
    }
    bind();
    renderCmdMenu();
    refresh().then(function () { connectEvents(); });
    setInterval(function () {
      if (S.status && S.status.state === "waiting") { renderStatus(); }
    }, 1000);
    setInterval(function () { renderSessions(); }, 30000);
    window.addEventListener("focus", function () { clearUnread(S.session); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) { clearUnread(S.session); } });
  }
  boot();
})();

})();</script>
</body>
</html>
