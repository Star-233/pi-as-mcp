[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanchat-mcp"
version = "1.1.0"
description = "Human-in-the-loop MCP server: agents stop and wait for the human instead of ending the conversation (TUI + browser UI, works with AgentDock)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "HumanChat MCP contributors" }]
keywords = ["mcp", "model-context-protocol", "agentdock", "human-in-the-loop", "ai-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: System :: Monitoring",
  "Environment :: Web Environment",
]
# 零依赖：只用 Python 标准库（刻意如此，保证在 AgentDock 容器里直接可跑）
dependencies = []

[project.urls]
Homepage = "https://github.com/uvwt/agentdock"

[project.scripts]
"humanchat-mcp" = "humanchat.server:main"
"humanchat" = "humanchat.cli:console_main"
"humanchat-web" = "humanchat.webui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
