<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-mcp · human channel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         background:#14161a; color:#e6e8eb; display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 14px; border-bottom:1px solid #262a31; display:flex; gap:10px; align-items:center; }
  header b { font-weight:600; }
  #status { margin-left:auto; font-size:12px; padding:3px 9px; border-radius:999px;
            background:#1e222a; color:#8b93a1; }
  #status.waiting { background:#3a2f12; color:#f0b429; }
  #status.live { background:#12291c; color:#3fb950; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:min(760px,88%); padding:9px 12px; border-radius:10px; white-space:pre-wrap;
       word-break:break-word; border:1px solid transparent; }
  .agent { align-self:flex-start; background:#1c2027; border-color:#262a31; }
  .human { align-self:flex-end; background:#1f3a5f; border-color:#2b4f7d; }
  .meta { font-size:11px; color:#7d8593; margin-bottom:3px; }
  .q { border-color:#f0b429 !important; }
  footer { border-top:1px solid #262a31; padding:10px; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:44px; padding:11px; border-radius:9px;
             border:1px solid #2c313a; background:#1a1e24; color:inherit; font:inherit; }
  textarea:focus { outline:none; border-color:#3f6ea8; }
  button { padding:0 18px; border-radius:9px; border:0; background:#2f6feb; color:#fff;
           font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .empty { color:#6b7280; text-align:center; margin:auto; font-size:13px; }
</style>
</head>
<body>
<header><b>pi-mcp</b><span style="color:#7d8593">human channel</span><span id="status">connecting…</span></header>
<div id="log"><div class="empty">No messages yet.</div></div>
<footer>
  <textarea id="in" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">Send</button>
</footer>
<script>
var qs = new URLSearchParams(location.search);
var token = qs.get('token') || '';
var log = document.getElementById('log');
var status = document.getElementById('status');
var input = document.getElementById('in');
var sendBtn = document.getElementById('send');
var seen = {};

function fmt(t) { return new Date(t).toLocaleTimeString(); }

function render(e) {
  if (seen[e.id]) return;
  seen[e.id] = 1;
  var empty = log.querySelector('.empty');
  if (empty) empty.remove();
  var d = document.createElement('div');
  d.className = 'm ' + e.role + (e.kind === 'question' ? ' q' : '');
  var meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = (e.role === 'agent' ? 'agent' : 'you') + ' · ' + e.kind + ' · ' + fmt(e.at);
  var body = document.createElement('div');
  body.textContent = e.text;
  d.appendChild(meta); d.appendChild(body);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function setStatus(waiting) {
  if (waiting) { status.textContent = waiting === 'ask' ? 'waiting for your answer' : 'agent is waiting'; status.className = 'waiting'; }
  else { status.textContent = 'connected'; status.className = 'live'; }
}

var es = new EventSource('/events?token=' + encodeURIComponent(token));
es.onmessage = function (ev) {
  var msg = JSON.parse(ev.data);
  if (msg.type === 'history') { msg.entries.forEach(render); setStatus(msg.waiting); }
  else if (msg.type === 'entry') { render(msg.entry); }
  else if (msg.type === 'state') { setStatus(msg.waiting); }
};
es.onerror = function () { status.textContent = 'reconnecting…'; status.className = ''; };
setStatus(null);

function send() {
  var text = input.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  fetch('/say?token=' + encodeURIComponent(token), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: text })
  }).then(function () { input.value = ''; input.focus(); })
    .catch(function (e) { alert('send failed: ' + e); })
    .finally(function () { sendBtn.disabled = false; });
}
sendBtn.onclick = send;
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
